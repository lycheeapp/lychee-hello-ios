# XcodeGen project definition for Lychee Hello (iOS).
#
# The .xcodeproj is generated rather than committed: a hand-maintained pbxproj is the usual source
# of merge conflicts on a mobile team, and this file is reviewable.
#
#   brew install xcodegen
#   xcodegen generate
#   open LycheeHello.xcodeproj
#
# Dependencies are Swift Package Manager only — no CocoaPods, unlike the legacy `lychee-ios`
# workspace. Nothing here needs a pod, and SPM keeps the checkout clean.

name: LycheeHello
options:
  bundleIdPrefix: org.lycheeapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # `targeted`, not `complete`. Complete checking flags SwiftUI patterns that are safe in
    # practice — e.g. constructing a @MainActor view model in a View's property initialiser — and
    # would block the first build on diagnostics that are migration work, not real races.
    # Raise to `complete` as a deliberate task once the app builds and runs; the one genuine
    # concurrency issue (SSERealtimeClient) is documented in that file and in the README.
    SWIFT_STRICT_CONCURRENCY: targeted
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    minVersion: 11.0.0
    maxVersion: 12.0.0

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  LycheeHello:
    type: application
    platform: iOS
    # NOTE: this must match BUNDLE_ID in GoogleService-Info.plist exactly, or Firebase
    # registration silently targets the wrong app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lycheeapp.lychee-hello
        PRODUCT_NAME: Lychee Hello
        INFOPLIST_FILE: LycheeHello/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: LycheeHello
        # Info.plist is consumed via INFOPLIST_FILE. Without this exclusion XcodeGen also adds it
        # to the Resources build phase, and Xcode fails with "Multiple commands produce
        # .../Info.plist". GoogleService-Info.plist is deliberately NOT excluded — it must be
        # bundled for Firebase to configure at runtime.
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
    # Crashlytics needs dSYM upload; added as a build phase once the team id is configured.
    postCompileScripts: []

  LycheeHelloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LycheeHelloTests
    dependencies:
      - target: LycheeHello
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lycheeapp.lychee-hello.tests
        # XcodeGen derives the test host from the target name, but the app's product is
        # "Lychee Hello" (PRODUCT_NAME above), so the derived path points at a bundle that is never
        # built and the tests cannot launch.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lychee Hello.app/Lychee Hello"

schemes:
  LycheeHello:
    build:
      targets:
        LycheeHello: all
        LycheeHelloTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LycheeHelloTests
    archive:
      config: Release
